    <path d="M8 26c2 3 2 9 0 12" fill="none" stroke="#FFF" stroke-width="3" stroke-linecap="round"/>

    <!-- Fins -->
    <path d="M29 22c1-6 5-9 9-10 2 4 1 8-1 11" fill="#F46A14" stroke="#192A3A" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M30 43c1 6 5 8 9 9 1-4 0-7-2-10" fill="#F46A14" stroke="#192A3A" stroke-width="2.5" stroke-linejoin="round"/>

