<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
    <defs>
        <linearGradient id="water" x1="7" y1="5" x2="58" y2="60" gradientUnits="userSpaceOnUse">
            <stop stop-color="#20D4E8"/>
            <stop offset="1" stop-color="#0877B9"/>
        </linearGradient>
        <linearGradient id="orange" x1="15" y1="20" x2="50" y2="45" gradientUnits="userSpaceOnUse">
            <stop stop-color="#FF9D18"/>
            <stop offset="1" stop-color="#F04B13"/>
        </linearGradient>
    </defs>

    <rect width="64" height="64" rx="15" fill="url(#water)"/>
    <circle cx="13" cy="13" r="3" fill="#FFF" opacity=".42"/>
    <circle cx="19" cy="8" r="1.5" fill="#FFF" opacity=".3"/>

