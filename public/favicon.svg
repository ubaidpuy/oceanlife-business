    <path d="M45 19c-2 4-2 8-1 13-1 5-1 9 1 13 3-1 6-2 8-4-2-3-2-6-1-9-1-3-1-6 1-9-2-2-5-3-8-4Z" fill="#FFF7E8" stroke="#192A3A" stroke-width="2" stroke-linejoin="round"/>

    <!-- Face -->
    <circle cx="51" cy="28" r="3.7" fill="#FFF" stroke="#192A3A" stroke-width="1.5"/>
    <circle cx="52" cy="28" r="1.7" fill="#192A3A"/>
    <path d="M54 36c-2 2-4 2-6 1" fill="none" stroke="#192A3A" stroke-width="1.8" stroke-linecap="round"/>
